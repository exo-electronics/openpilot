# A minimal config for the UI tests, separate from the repo's pyproject.toml.
#
# The repo config turns on xdist (-n, --dist=loadgroup) and pytest-asyncio.
# Neither applies here: these tests are a few hundred milliseconds of Qt
# widget checks with no async and no benefit from sharding, and depending on
# both plugins would make the UI gate fail on a machine that has Qt but not
# them. Pointing pytest at this file instead keeps the UI suite runnable with
# nothing but pytest and a Qt binding.
[pytest]
addopts = -q
testpaths = .
